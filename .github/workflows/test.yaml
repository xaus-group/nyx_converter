name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Unit Tests (fast, no emulator)
  # ------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 💾 Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('example/pubspec.lock') }}
          restore-keys: flutter-pub-${{ runner.os }}-

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧪 Run unit tests
        run: flutter test

  # ------------------------------------------------------------------
  # JOB 2: Integration Tests (Android emulator)
  # ------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 💾 Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('example/pubspec.lock') }}
          restore-keys: flutter-pub-${{ runner.os }}-

      - name: 📦 Get main package dependencies
        run: flutter pub get

      - name: 📦 Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: 🤖 Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29 # lighter than 34
          target: default # fewer Google services
          arch: x86_64 # fully supported
          profile: Nexus 5 # small device
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -cores 2 -memory 1024 -accel on
          disable-animations: true
          emulator-boot-timeout: 900 # 15 minutes
          script: |
            cd example
            flutter test integration_test/ -d emulator-5554

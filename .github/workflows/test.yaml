name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('example/pubspec.lock') }}
          restore-keys: flutter-pub-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter test

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('example/pubspec.lock') }}
          restore-keys: flutter-pub-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -cores 2 -memory 1024
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd example
            flutter test integration_test/ 

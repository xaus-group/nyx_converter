name: Update README Version

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0
      - "[0-9]+.[0-9]+.[0-9]+" # Or triggers on tags like 1.0.0

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Replace placeholder in README.md
        run: |
          sed -i "s/{{VERSION}}/${{ env.VERSION }}/g" README.md

      - name: Commit and push updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update install version to ${{ env.VERSION }}" || echo "No changes to commit"
          git push

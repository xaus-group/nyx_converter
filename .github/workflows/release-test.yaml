name: Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Android Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get package dependencies
        run: flutter pub get

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Cache AVD
        uses: actions/cache@v3
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/sdk/system-images
          key: avd-${{ runner.os }}-api29-x86

      - name: Create AVD (if not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager --install "system-images;android-29;default;x86"
          echo "no" | avdmanager create avd -n test -k "system-images;android-29;default;x86" -d "Nexus 5"

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: test
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -cores 2 -memory 1024 -accel on
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd example
            flutter test integration_test/ -d emulator-5554